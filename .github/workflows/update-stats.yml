name: Update CS2 Stats

on:
  schedule:
    # Run every Sunday at 10:00 UTC
    - cron: '0 10 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run stats update
        run: python update_stats.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add report_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Weekly CS2 stats sync" && git push)
